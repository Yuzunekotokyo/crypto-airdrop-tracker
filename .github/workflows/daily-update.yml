name: 毎日エアドロップ情報更新 + Gmail通知

on:
  schedule:
    # 毎日 08:00 JST (= 23:00 UTC 前日)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force_email:
        description: "強制メール送信 (変更なしでも送信)"
        required: false
        default: "false"

jobs:
  update:
    name: データ更新 & メール通知
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.12 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存パッケージインストール
        run: pip install -r requirements.txt

      - name: dataディレクトリ確保
        run: mkdir -p data

      # 既存データをGitHubから復元 (前回の airdrops.json / updates.json)
      - name: 既存データキャッシュ復元
        uses: actions/cache@v4
        with:
          path: data/
          key: airdrop-data-${{ github.run_id }}
          restore-keys: |
            airdrop-data-

      - name: 日次更新実行
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT || 'tsukamoto.kei@gmail.com' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FORCE_EMAIL: ${{ github.event.inputs.force_email || 'false' }}
        run: |
          python - <<'EOF'
          import os
          from updater import run_daily_update

          force = os.getenv("FORCE_EMAIL", "false").lower() == "true"
          summary = run_daily_update(force_email=force)

          print("=== 更新サマリー ===")
          print(f"合計: {summary['total_airdrops']} 件")
          print(f"新着: {summary['added_count']} 件 — {summary.get('added_names', [])}")
          print(f"変更: {summary['changed_count']} 件")
          print(f"HOT昇格: {summary.get('newly_hot_count', 0)} 件")
          print(f"メール送信: {summary['email_sent']}")
          EOF

      - name: 更新データをコミット & プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "変更なし — コミットをスキップ"
          else
            git commit -m "chore: 日次データ更新 $(date +'%Y-%m-%d %H:%M JST')"
            git push
          fi
